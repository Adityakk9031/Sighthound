[package]
name = "find_vulns"
version = "0.1.0"
edition = "2021"
authors = ["Corgea Team"]
description = "A blazing fast vulnerability scanner for source code using tree-sitter"
repository = "https://github.com/corgea/greppy_prototype"

[[bin]]
name = "find_vulns"
path = "src/main.rs"

[lib]
name = "find_vulns"
path = "src/lib.rs"

[features]
default = ["python", "java", "javascript"]
python = ["tree-sitter-python"]
java = ["tree-sitter-java"]
javascript = ["tree-sitter-javascript"]

[dependencies]
tree-sitter = "0.22"
tree-sitter-python = { version = "0.21", optional = true }
tree-sitter-java = { version = "0.21", optional = true }
tree-sitter-javascript = { version = "0.21", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
regex = "1.0"
walkdir = "2.4"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.19"
rayon = "1.8"
indicatif = "0.17"
glob = "0.3"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true