[package]
name = "find_vulns"
version = "0.1.0"
edition = "2021"
authors = ["Corgea Team"]
description = "A blazing fast vulnerability scanner for source code using tree-sitter"
repository = "https://github.com/corgea/greppy_prototype"

[[bin]]
name = "find_vulns"
path = "src/main.rs"

[lib]
name = "find_vulns"
path = "src/lib.rs"

[dependencies]
tree-sitter = "0.22"
tree-sitter-python = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.4"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.19"
rayon = "1.8"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true 